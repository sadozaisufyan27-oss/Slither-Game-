<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slither - Snake Game</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
        background: linear-gradient(135deg, #0d1b2a, #1b263b);
        color: white;
        font-family: 'Segoe UI', sans-serif;
        transition: background 0.8s ease;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
    }
  .glass {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 15px;
        padding: 15px;
    }
    #gameCanvas {
        background: rgba(0,0,0,0.3);
        border: 2px solid #00ff88;
        border-radius: 10px;
        box-shadow: 0 0 20px #00ff88;
    }
  .btn-neon {
        background: #00ff88;
        color: black;
        font-weight: bold;
        border: none;
        box-shadow: 0 0 10px #094d6d;
    }
  .btn-neon:hover {
        background: #00cc6a;
        color: white;
    }
    #mobileControls button {
        width: 60px; height: 60px; margin: 5px;
        font-size: 24px;
    }
</style>
</head>
<body>

<h1 class="mb-3">🐍 Slither</h1>

<div class="glass d-flex gap-3 mb-3">
    <span class="badge bg-success fs-5">Score: <span id="score">0</span></span>
    <span class="badge bg-warning text-dark fs-5">High Score: <span id="highScore">0</span></span>
    <span class="badge bg-info fs-5">Level: <span id="level">1</span></span>
</div>

<div class="mb-3">
    <button class="btn btn-neon me-2" onclick="setLevel(1)">Easy</button>
    <button class="btn btn-neon me-2" onclick="setLevel(2)">Medium</button>
    <button class="btn btn-neon me-2" onclick="setLevel(3)">Hard</button>
    <button id="pauseBtn" class="btn btn-danger" onclick="togglePause()">Pause</button>
</div>

<canvas id="gameCanvas" width="400" height="400"></canvas>

<div id="mobileControls" class="mt-3 d-block d-md-none">
    <div><button class="btn btn-light" onclick="changeDir(0,-1)">⬆️</button></div>
    <div>
        <button class="btn btn-light" onclick="changeDir(-1,0)">⬅️</button>
        <button class="btn btn-light" onclick="changeDir(1,0)">➡️</button>
    </div>
    <div><button class="btn btn-light" onclick="changeDir(0,1)">⬇️</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const grid = 20;
let snake = [{x: 10, y: 10}];
let food = {x: 5, y: 5};
let dx = 1, dy = 0;
let score = 0;
let level = 1;
let speed = 150;
let gameLoop;
let isPaused = false;

const levelSettings = {
    1: {speed: 120, bg: 'linear-gradient(135deg, #0d1b2a, #1b263b)'},
    2: {speed: 100, bg: 'linear-gradient(135deg, #1b263b, #415a77)'},
    3: {speed: 70, bg: 'linear-gradient(135deg, #3a0a0a, #8b0000)'}
};

document.getElementById('highScore').innerText = localStorage.getItem('slitherHighScore') || 0;

function setLevel(lvl) {
    level = lvl;
    speed = levelSettings[lvl].speed;
    document.body.style.background = levelSettings[lvl].bg;
    document.getElementById('level').innerText = lvl;
    startGame();
}

function startGame() {
    clearInterval(gameLoop);
    snake = [{x: 10, y: 10}];
    dx = 1; dy = 0; score = 0; isPaused = false;
    document.getElementById('pauseBtn').innerText = 'Pause';
    document.getElementById('pauseBtn').className = 'btn btn-danger';
    placeFood();
    gameLoop = setInterval(update, speed);
}

function togglePause() {
    isPaused =!isPaused;
    if(isPaused) {
        clearInterval(gameLoop);
        document.getElementById('pauseBtn').innerText = 'Resume';
        document.getElementById('pauseBtn').className = 'btn btn-success';
    } else {
        gameLoop = setInterval(update, speed);
        document.getElementById('pauseBtn').innerText = 'Pause';
        document.getElementById('pauseBtn').className = 'btn btn-danger';
    }
}

function update() {
    if(isPaused) return;
    const head = {x: snake[0].x + dx, y: snake[0].y + dy};

    if(head.x < 0 || head.y < 0 || head.x >= canvas.width/grid || head.y >= canvas.height/grid || snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver();
        return;
    }

    snake.unshift(head);

    if(head.x === food.x && head.y === food.y) {
        score += 5 * level;
        if(score > localStorage.getItem('slitherHighScore')) {
            localStorage.setItem('slitherHighScore', score);
            document.getElementById('highScore').innerText = score;
        }
        document.getElementById('score').innerText = score;
        placeFood();
    } else {
        snake.pop();
    }
    draw();
}

function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#00ff88';
    snake.forEach(s => ctx.fillRect(s.x*grid, s.y*grid, grid-2, grid-2));
    ctx.fillStyle = 'red';
    ctx.fillRect(food.x*grid, food.y*grid, grid-2, grid-2);
}

function placeFood() {
    food.x = Math.floor(Math.random() * (canvas.width/grid));
    food.y = Math.floor(Math.random() * (canvas.height/grid));
}

function gameOver() {
    clearInterval(gameLoop);
    alert('Game Over! Score: ' + score);
    startGame();
}

function changeDir(x,y) { if(!isPaused && dx!== -x && dy!== -y) {dx=x; dy=y;} }

document.addEventListener('keydown', e => {
    if(e.key === ' ') togglePause(); // Space bar se bhi pause hoga
    if(isPaused) return;
    if(e.key === 'ArrowUp') changeDir(0,-1);
    if(e.key === 'ArrowDown') changeDir(0,1);
    if(e.key === 'ArrowLeft') changeDir(-1,0);
    if(e.key === 'ArrowRight') changeDir(1,0);
});

startGame();
</script>
</body>
</html>
